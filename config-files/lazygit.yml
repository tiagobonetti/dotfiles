os:
  edit: 'NVIM_APPNAME=nvim-lazy nvim {{filename}}'
  editAtLine: 'NVIM_APPNAME=nvim-lazy nvim +{{line}} {{filename}}'
  openDirInEditor: 'NVIM_APPNAME=nvim-lazy nvim {{dir}}'
git:
  diffRenderers:
    - colorArg: always
      command: delta --dark --paging=never
  allBranchesLogCmds:
    - git log --graph --all --color=always --abbrev-commit --decorate --oneline
  parseEmoji: true
gui:
  mouseEvents: true
  sidePanelWidth: 0.3
  showCommandLog: true
  showBottomLine: true
