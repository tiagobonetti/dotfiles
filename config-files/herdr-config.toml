onboarding = false
[ui]
agent_panel_sort = "spaces"
show_agent_labels_on_pane_borders = true

status_indicators = "symbols"

[ui.toast]
delivery = "herdr"

[theme]
name = "solarized"
auto_switch = false

[worktrees]
directory = "~/lumicks/repos/worktrees/"

[keys]
prefix = "ctrl+h"

[[keys.command]]
key = "prefix+f"
type = "shell"
command = "open -a Fork \"${HERDR_ACTIVE_PANE_CWD:-.}\""
description = "open current working directory in Fork"

[[keys.command]]
key = "prefix+g"
type = "shell"
command = """
cd "${HERDR_ACTIVE_PANE_CWD:-.}" || exit
output=$(gh pr view --web 2>&1) || {
  status=$?
  herdr notification show "Could not open PR" --body "${output:-gh pr view failed (exit $status)}"
  exit "$status"
}
"""
description = "open current branch PR in browser"
